{{- $secretName := printf "%s-auth" (include "ai-eventer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ai-eventer.labels" . | nindent 4 }}
  annotations:
    # Generated once on install; the `lookup` above + this annotation together
    # mean `helm upgrade` never regenerates or deletes it - same pattern used
    # by any chart that hands out a random initial credential (e.g. Bitnami
    # charts' admin passwords).
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ if $existing }}{{ index $existing.data "admin-password" }}{{ else }}{{ randAlphaNum 20 | b64enc }}{{ end }}
  cookie-key: {{ if $existing }}{{ index $existing.data "cookie-key" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
