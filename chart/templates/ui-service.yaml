apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-eventer.fullname" . }}-ui
  labels:
    {{- include "ai-eventer.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "ai-eventer.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: 8501
