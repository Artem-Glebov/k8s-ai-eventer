apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-eventer.fullname" . }}-ui
  labels:
    {{- include "ai-eventer.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-eventer.labels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "ai-eventer.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      securityContext:
        {{- include "ai-eventer.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
            {{- include "ai-eventer.containerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: 8501
          env:
            - name: HOME
              value: /tmp
            - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
              value: "false"
            - name: AGENT_API_URL
              value: "http://{{ include "ai-eventer.fullname" . }}-agent:8000"
            - name: AUTH_COOKIE_NAME
              value: {{ .Values.auth.cookieName | quote }}
            - name: AUTH_COOKIE_EXPIRY_DAYS
              value: {{ .Values.auth.cookieExpiryDays | quote }}
            - name: AUTH_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-eventer.fullname" . }}-auth
                  key: cookie-key
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
