apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-eventer.fullname" . }}-agent-data
  labels:
    {{- include "ai-eventer.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageClassName }}
  storageClassName: {{ .Values.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.agent.persistence.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-eventer.fullname" . }}-ollama-models
  labels:
    {{- include "ai-eventer.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageClassName }}
  storageClassName: {{ .Values.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
